spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
app:
  cors:
    allowed-origins: http://localhost:3000,http://192.168.*,http://10.*,http://172.*
  mail:
    retry:
      max-attempts: 1
      delay-ms: 500
  session:
    use-secure-cookie: false
    same-site: Lax

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.zaxxer.hikari: DEBUG
