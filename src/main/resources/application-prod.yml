spring:
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 60000
      leak-detection-threshold: 20000

app:
  mail:
    retry:
      max-attempts: 2
      delay-ms: 1000

logging:
  level:
    com.zaxxer.hikari: WARN
